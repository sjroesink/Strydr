<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#215c45" />
    <meta name="description" content="Find a new way around. Plan running and walking routes, explore the map, and take your route along as GPX." />
    <title>Meander</title>
    <script>
      try {
        const preference = localStorage.getItem('meander.theme');
        const dark = preference === 'dark' || preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
