# Unraid Compose Manager stack "meander": the app, built from the server checkout in
# /mnt/user/appdata/meander/repo. The deploy webhook fast-forwards that checkout to the
# verified commit and runs `docker compose build --pull && up -d` on every push to main.
# Needs the "meander-services" stack, which creates the shared "meander" network.
services:
  meander:
    build:
      context: /mnt/user/appdata/meander/repo
      args:
        # Keyless basemap: the PMTiles file and its assets are mounted at /app/map.
        VITE_PMTILES_URL: /map/netherlands.pmtiles
    image: meander:local
    container_name: meander
    restart: unless-stopped
    ports:
      - "3118:8080"
    environment:
      AllowedHosts: "meander.roesink.dev;meander.sander.ninja;10.0.0.170;localhost"
      # Cloudflare -> Traefik -> app: rate limits use the visitor's IP, not the proxy's.
      ReverseProxy__ClientIpHeader: CF-Connecting-IP
      ResultStorage__DatabasePath: /app/data/meander.sqlite
      Ors__BaseUrl: http://meander-ors:8082/ors/
      Ors__SupportsGreen: "false"
      Ors__DirectionsPerMinute: "600"
      Ors__SnapsPerMinute: "600"
      Ors__GeocodingPerMinute: "600"
      Geocoding__Provider: Photon
      Photon__BaseUrl: http://meander-photon:2322/
      Woodland__Url: http://meander-overpass/api/interpreter
      Woodland__TimeoutSeconds: "15"
      Woodland__MaxResponseMegabytes: "64"
      MapData__Path: /app/map
    volumes:
      # Writable by the image's non-root user (uid 1654).
      - /mnt/user/appdata/meander/data:/app/data
      - /mnt/user/appdata/meander/map:/app/map:ro
    networks: [meander]

networks:
  meander:
    external: true
