# Keyless mode: self-hosted ORS routing, Photon geocoding and a local PMTiles basemap.
# Run scripts/fetch-map-data first, then:
#   docker compose -f compose.yaml -f compose.local.yaml up --build
# The first ORS start builds the routing graph (roughly 10-20 minutes); routing returns 503 until it is ready.
services:
  ors:
    image: openrouteservice/openrouteservice:v10.1.0
    environment:
      XMS: 1g
      XMX: 4g
      ors.engine.profile_default.build.source_file: /home/ors/files/netherlands-latest.osm.pbf
      ors.engine.profile_default.build.elevation: "true"
      ors.engine.profiles.driving-car.enabled: "false"
      # The default foot-walking profile already stores way surfaces (used for unpaved routing).
      # It has no green index, so the API runs with Ors__SupportsGreen=false.
      ors.engine.profiles.foot-walking.enabled: "true"
      # Without this storage ORS adds "Extra info ... not available: roadaccessrestrictions" to every route.
      ors.engine.profiles.foot-walking.build.ext_storages.RoadAccessRestrictions.use_for_warnings: "true"
    volumes:
      - ./data/ors/files:/home/ors/files:ro
      - ors-graphs:/home/ors/graphs
      - ors-elevation:/home/ors/elevation_cache
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8082/ors/v2/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30m
  photon:
    image: rtuszik/photon-docker:2.4.0
    environment:
      REGION: netherlands
      UPDATE_STRATEGY: DISABLED
    volumes:
      - photon-data:/photon/data
  api:
    environment:
      Ors__BaseUrl: http://ors:8082/ors/
      Ors__SupportsGreen: "false"
      # Local instances have no quota; keep a sane cap on concurrent work instead.
      Ors__DirectionsPerMinute: "600"
      Ors__SnapsPerMinute: "600"
      Ors__GeocodingPerMinute: "600"
      Geocoding__Provider: Photon
      Photon__BaseUrl: http://photon:2322/
      MapData__Path: /app/map
    volumes:
      - ./data/map:/app/map:ro
    depends_on:
      - ors
      - photon
  web:
    environment:
      VITE_PMTILES_URL: /map/netherlands.pmtiles
volumes:
  ors-graphs:
  ors-elevation:
  photon-data:
